[project]
name = "backend"
version = "0.1.0"
description = "Backend del gioco d'asta anime"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.165.0",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.4",
    "sqlalchemy>=2.1.9",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = ["httpx>=0.28.1", "mypy>=2.4.1", "pytest>=9.2.0", "ruff>=0.17.6"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

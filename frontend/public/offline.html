<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Arena Anime · senza connessione</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #05040c;
        color: #f6f3ff;
        font-family: system-ui, sans-serif;
        text-align: center;
        padding: 24px;
      }
      h1 {
        font-size: 2.2rem;
        margin: 0 0 8px;
        background: linear-gradient(95deg, #ffd45a, #ff3d81, #8b5cff);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      p {
        color: #a9a3c7;
        max-width: 22rem;
      }
      button {
        margin-top: 16px;
        padding: 12px 22px;
        border: 0;
        border-radius: 14px;
        font-weight: 800;
        color: #fff;
        background: linear-gradient(100deg, #ff3d81, #ff8a3d);
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Sei offline</h1>
      <p>
        Arena Anime ha bisogno della rete per le aste e gli scontri. Riprova appena sei di nuovo
        connesso.
      </p>
      <button onclick="location.reload()">Riprova</button>
    </main>
  </body>
</html>

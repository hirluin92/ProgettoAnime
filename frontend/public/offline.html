<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Pagina statica: non può leggere APP_NAME, quindi non cita il nome del gioco (c'è lo stemma). -->
    <title>Senza connessione</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(rgb(243 236 221 / 0.1) 1.2px, transparent 1.6px) 0 0 / 12px 12px,
          #0e0d10;
        color: #f3ecdd;
        font-family: system-ui, sans-serif;
        text-align: center;
        padding: 24px;
      }
      img {
        width: 96px;
        height: 96px;
        transform: rotate(-6deg);
      }
      h1 {
        display: inline-block;
        margin: 18px 0 10px;
        padding: 6px 22px 4px 12px;
        font:
          italic 900 2.2rem/1 Impact,
          "Arial Narrow",
          system-ui,
          sans-serif;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        color: #0e0d10;
        background: #f3ecdd;
        box-shadow: 5px 5px 0 #e0301f;
      }
      p {
        color: #b5aea0;
        max-width: 22rem;
        margin: 8px auto 0;
        font-weight: 600;
        line-height: 1.5;
      }
      button {
        margin-top: 20px;
        min-height: 48px;
        padding: 0 26px;
        border: 2px solid #000;
        border-radius: 5px;
        font:
          900 1rem/1 system-ui,
          sans-serif;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #fff;
        background: #e0301f;
        box-shadow: 0 4px 0 #8c1a10;
        cursor: pointer;
      }
      button:active {
        transform: translateY(3px);
        box-shadow: 0 1px 0 #8c1a10;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon.svg" alt="" />
      <br />
      <h1>Sei offline</h1>
      <p>
        Per duelli, aste e sfide serve la rete. Riprova appena sei di nuovo connesso: la tua
        collezione ti aspetta.
      </p>
      <button onclick="location.reload()">Riprova</button>
    </main>
  </body>
</html>
